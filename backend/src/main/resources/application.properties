# Application Configuration
spring.application.name=rivyuu-connect

# Server
server.port=8080

# Database — PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/rivyuu_db
spring.datasource.username=postgres
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=rivyuu_connect_super_secret_key_change_this_in_production_2025
jwt.expiration=86400000

# CORS
spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Logging
logging.level.com.rivyuu=DEBUG
logging.level.org.springframework.security=WARN
