<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Student Management Dashboard</h1>
      <p class="subtitle">Manage student records with ease</p>
    </header>

    <main class="main-grid">
      <section class="card form-card">
        <h2 id="formTitle">Add Student</h2>
        <form id="studentForm" novalidate>
          <input type="hidden" id="editIndex" value="">

          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter full name" required>
            <small class="error" id="nameError"></small>
          </div>

          <div class="form-group">
            <label for="registerNumber">Register Number</label>
            <input type="text" id="registerNumber" placeholder="e.g. REG2026001" required>
            <small class="error" id="registerError"></small>
          </div>

          <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" placeholder="e.g. Computer Science" required>
            <small class="error" id="departmentError"></small>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="year">Year</label>
              <select id="year" required>
                <option value="">Select year</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
              </select>
              <small class="error" id="yearError"></small>
            </div>

            <div class="form-group">
              <label for="marks">Marks</label>
              <input type="number" id="marks" min="0" max="100" placeholder="0 - 100" required>
              <small class="error" id="marksError"></small>
            </div>
          </div>

          <div class="btn-group">
            <button type="submit" id="addBtn" class="btn btn-primary">Add Student</button>
            <button type="button" id="saveBtn" class="btn btn-success hidden">Save</button>
            <button type="button" id="cancelBtn" class="btn btn-secondary hidden">Cancel</button>
          </div>
        </form>
      </section>

      <section class="card table-card">
        <div class="table-header">
          <h2>Student Records</h2>
          <div class="search-wrapper">
            <label for="searchInput" class="sr-only">Search students</label>
            <input type="text" id="searchInput" placeholder="Search by name, register no, dept...">
          </div>
        </div>
        <div class="table-toolbar">
          <div class="toolbar-group">
            <label for="filterDepartment" class="sr-only">Filter by department</label>
            <select id="filterDepartment">
              <option value="">All Departments</option>
            </select>

            <label for="filterYear" class="sr-only">Filter by year</label>
            <select id="filterYear">
              <option value="">All Years</option>
              <option value="1">Year 1</option>
              <option value="2">Year 2</option>
              <option value="3">Year 3</option>
              <option value="4">Year 4</option>
            </select>

            <label for="sortBy" class="sr-only">Sort students</label>
            <select id="sortBy">
              <option value="">Sort By</option>
              <option value="name-asc">Name (A-Z)</option>
              <option value="name-desc">Name (Z-A)</option>
              <option value="marks-asc">Marks (Low-High)</option>
              <option value="marks-desc">Marks (High-Low)</option>
              <option value="year-asc">Year (Low-High)</option>
              <option value="year-desc">Year (High-Low)</option>
            </select>
          </div>
          <div class="toolbar-group actions">
            <button type="button" id="exportCsvBtn" class="btn btn-primary">Export CSV</button>
            <input type="file" id="importCsvInput" accept=".csv,text/csv" class="hidden">
            <button type="button" id="importCsvBtn" class="btn btn-secondary">Import CSV</button>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Register No.</th>
                <th>Department</th>
                <th>Year</th>
                <th>Marks</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="studentTableBody"></tbody>
          </table>
          <p id="emptyState" class="empty-state hidden">No student records found.</p>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
